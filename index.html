header b{font-size:18px}main{max-width:900px;margin:auto;padding:16px}
.crumb{color:var(--mu);font-size:14px;margin-bottom:10px}.crumb a{color:var(--pr);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;font-weight:600}
.tile:hover{border-color:var(--pr)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
textarea{min-height:60px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ok{color:var(--ok)}.er{color:var(--er)}.mu{color:var(--mu)}h2,h3{margin:8px 0}
label.o{display:block;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
.qwrap{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}@media(max-width:760px){.qwrap{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--pr)}.opt .rd{width:22px;height:22px;border:2px solid var(--mu);border-radius:50%;flex:none}
.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card))}.opt.sel .rd{border-color:var(--pr);background:radial-gradient(var(--pr) 45%,transparent 50%)}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;position:sticky;top:8px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:6px 0 10px}
.nums div{border:1px solid var(--bd);border-radius:10px;text-align:center;padding:9px 0;font-weight:600;cursor:pointer;font-size:14px}
.nums div.dn{background:var(--pr);color:#fff;border-color:var(--pr)}.nums div.cu{outline:3px solid var(--tx);outline-offset:1px}
.lb{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin-top:6px}
button:disabled{opacity:.4;cursor:default}
</style></head><body>

function parse(txt){const out=[];let c=null,bad=0,last=null;
 const fin=()=>{if(!c)return;
  if(c.o.length>=2&&c.o.filter(x=>x.c).length==1)out.push({q:c.q,o:c.o.map(x=>x.t),a:c.o.findIndex(x=>x.c)});
  else if(c.o.length==1&&c.o[0].c&&c.o[0].t!==""&&!isNaN(+c.o[0].t))out.push({q:c.q,w:1,a:c.o[0].t});else bad++;c=null};
 txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^([#+\-–—•])\s*(.*)$/);
  if(!m){if(last=="q")c.q+=" "+l;else if(last=="o"&&c.o.length)c.o[c.o.length-1].t+=" "+l;return}
  const k=m[1],v=m[2];
  if(k=="#"){fin();c={q:v,o:[]};last="q"}
  else if(!c)return;
  else if(k=="+"){c.o.push({t:v,c:1});last="o"}
  else{c.o.push({t:v,c:0});last="o"}});
 fin();return{items:out,bad}}
